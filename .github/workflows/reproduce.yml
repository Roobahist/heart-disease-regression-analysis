name: Reproduce regression analysis

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'report.Rmd'
      - '.github/workflows/reproduce.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2
      - name: Restore and install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::glmnet
            any::ggplot2
            any::svglite
            any::rmarkdown
            any::knitr
          cache-version: 1
      - name: Run and validate regression analysis
        run: |
          Rscript scripts/run_analysis.R
          test -s results/model_metrics.csv
          test -s results/figures/test_roc_curves.png
          test -s results/figures/lasso_cv.png
          test -s results/figures/lasso_cv.svg
          test -s results/figures/test_probability_distribution.png
          test -s results/lasso_cv_curve.csv
          test -s results/RESULTS.md
      - name: Render self-contained HTML report
        run: |
          Rscript -e "rmarkdown::render('report.Rmd', output_file='report.html', output_dir='results', quiet=TRUE)"
          test -s results/report.html
      - name: Commit verified results and figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/
          if ! git diff --cached --quiet; then
            git commit -m "results: regenerate verified model comparisons and figures"
            git push origin HEAD:main
          fi
